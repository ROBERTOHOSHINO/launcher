<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>記録ジェネレータ — CHROMAKEY AUTH™</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
:root{ --indigo:#1A237E; --gold:#F9A825; --ivory:#E8E0D0; --ink:#22201c; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--ivory);color:var(--ink);
  min-height:100vh;padding:32px 16px;display:flex;justify-content:center}
.card{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:30px 26px;
  border:1px solid rgba(26,35,126,.12)}
h1{font-size:18px;color:var(--indigo);margin-bottom:6px}
.sub{font-size:11.5px;line-height:1.8;color:#6a655c;margin-bottom:20px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--indigo);margin:14px 0 6px}
input{width:100%;padding:10px;border:1.5px solid rgba(26,35,126,.25);border-radius:8px;
  font-size:14px;font-family:inherit}
.pairs{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.pair{display:flex;gap:10px;align-items:center}
.pair .ch{font-size:30px;font-weight:700;width:56px;height:56px;display:flex;align-items:center;
  justify-content:center;border-radius:10px;background:#faf8f4;border:2px solid rgba(0,0,0,.08)}
.pal{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;flex:1}
.sw{aspect-ratio:1;border-radius:4px;cursor:pointer;border:2px solid transparent}
.sw.on{border-color:var(--ink);transform:scale(1.12)}
button{margin-top:22px;width:100%;padding:13px;border:none;border-radius:10px;cursor:pointer;
  background:var(--indigo);color:#fff;font-size:14px;font-weight:700;font-family:inherit}
pre{margin-top:18px;background:#22201c;color:#E8E0D0;font-size:11px;line-height:1.7;
  padding:14px;border-radius:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;display:none}
.note{margin-top:14px;font-size:10.5px;line-height:1.8;color:#8a837c}
</style>
</head>
<body>
<div class="card">
  <h1>記録ジェネレータ — 自分のINDEXを作る</h1>
  <div class="sub">名前の文字と記憶の色を選ぶと、users.json に貼る記録(saltとハッシュのみ)を生成します。
  すべて端末内で完結し、色の正解はどこにも送信・保存されません。これがセルフサーブ版の種です。</div>

  <label>ID(半角英数)</label>
  <input id="uid" placeholder="taro" value="">
  <label>表示名</label>
  <input id="ulabel" placeholder="山田 太郎" value="">
  <label>名前の文字(1〜4文字。漢字・かな・アルファベット可)</label>
  <input id="uchars" placeholder="太郎" maxlength="4" value="">
  <label>それぞれの文字に、記憶の色を</label>
  <div class="pairs" id="pairs"><span style="font-size:11px;color:#8a837c">↑ 文字を入力すると現れます</span></div>
  <button id="gen" disabled>記録を生成する</button>
  <pre id="out"></pre>
  <div class="note">生成された記録を data/users.json の "users" 配列に追加すれば、その人はゲートから入れるようになります。
  PBKDF2-SHA256 × 310,000回 — deliberately paced。</div>
</div>

<script src="../js/auth-core.js"></script>
<script>
let pairs=[];
document.getElementById('uchars').addEventListener('input',e=>{
  const chars=[...e.target.value.trim()];
  pairs=chars.map(c=>({char:c,hex:null}));
  renderPairs();
});
function renderPairs(){
  const box=document.getElementById('pairs'); box.innerHTML='';
  pairs.forEach((p,i)=>{
    const row=document.createElement('div'); row.className='pair';
    const ch=document.createElement('div'); ch.className='ch'; ch.textContent=p.char;
    if(p.hex){ch.style.background=p.hex;ch.style.color=lum(p.hex)>150?'#22201c':'#fff';}
    const pal=document.createElement('div'); pal.className='pal';
    CKA.PAL.forEach(hex=>{
      const s=document.createElement('div'); s.className='sw'+(p.hex===hex?' on':''); s.style.background=hex;
      s.onclick=()=>{p.hex=hex;renderPairs();};
      pal.appendChild(s);
    });
    row.appendChild(ch); row.appendChild(pal); box.appendChild(row);
  });
  document.getElementById('gen').disabled = !(pairs.length && pairs.every(p=>p.hex)
    && document.getElementById('uid').value.trim());
}
function lum(hex){const n=parseInt(hex.slice(1),16);return 0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255);}
document.getElementById('uid').addEventListener('input',renderPairs);

document.getElementById('gen').onclick=async()=>{
  const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
  const iterations=310000;
  const hash=await CKA.pbkdf2Hex(CKA.normalize(pairs), salt, iterations);
  const rec={ id:document.getElementById('uid').value.trim(),
    label:document.getElementById('ulabel').value.trim()||document.getElementById('uid').value.trim(),
    chars:pairs.map(p=>p.char), salt, iterations, hash };
  const out=document.getElementById('out');
  out.textContent=JSON.stringify(rec,null,2);
  out.style.display='block';
};
</script>
</body>
</html>
